# Fly.io app config for the SlotBook API.
# Create the app once with: fly apps create slotbook-api
# Then: fly deploy

app = "slotbook-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in the built image before the new release takes traffic.
  # Requires DATABASE_URL secret to be set on the Fly app.
  release_command = "pnpm exec prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
